<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - DevRoadmap Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-slate-900">
  <div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm w-full max-w-md">
      <div class="p-6 flex flex-col space-y-1 text-center">
        <h3 class="font-bold text-2xl tracking-tight">Create an Account</h3>
        <p class="text-sm text-gray-500">Sign up to start tracking your learning roadmap</p>
      </div>
      
      <div class="p-6 pt-0">
        <form id="signup-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label for="firstName" class="text-sm font-medium">First Name</label>
              <input id="firstName" name="firstName" type="text" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div class="space-y-2">
              <label for="lastName" class="text-sm font-medium">Last Name</label>
              <input id="lastName" name="lastName" type="text" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
          </div>

          <div class="space-y-2">
            <label for="email" class="text-sm font-medium">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
              <input id="email" name="email" type="email" placeholder="m@example.com" required class="w-full rounded-md border border-gray-300 px-3 py-2 pl-10 text-sm">
            </div>
          </div>

          <div class="space-y-2">
            <label for="password" class="text-sm font-medium">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-3 top-3 h-4 w-4 text-gray-400"></i>
              <input id="password" name="password" type="password" required class="w-full rounded-md border border-gray-300 px-3 py-2 pl-10 text-sm">
            </div>
            <div class="h-1.5 w-full bg-gray-200 rounded-full mt-2 overflow-hidden">
              <div id="strength-bar" class="h-full w-0 transition-all duration-300"></div>
            </div>
            <div class="flex justify-between items-center">
              <p id="strength-text" class="text-xs text-gray-500 italic">Enter password...</p>
              <p class="text-[10px] text-gray-400">No spaces allowed</p>
            </div>
          </div>

          <button type="submit" class="w-full bg-blue-600 text-white rounded-md h-10 font-medium hover:bg-blue-700 transition-colors">
            Create Account
          </button>
        </form>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><span class="w-full border-t"></span></div>
          <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">Or continue with</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button onclick="alert('Redirecting to Google login...')" type="button" class="flex items-center justify-center rounded-md border border-gray-200 py-2 text-sm font-medium hover:bg-gray-50">
            <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" class="h-4 w-4 mr-2" alt="Google"> Google
          </button>
          <button onclick="alert('Redirecting to Outlook login...')" type="button" class="flex items-center justify-center rounded-md border border-gray-200 py-2 text-sm font-medium hover:bg-gray-50">
            <i data-lucide="mail" class="h-4 w-4 mr-2 text-blue-500"></i> Outlook
          </button>
        </div>

        <p class="mt-6 text-center text-sm text-gray-600">
          Already have an account? <a href="SignInPage.html" class="text-blue-600 hover:underline">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
